[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["verix*"]

[project]
name = "verix"
version = "0.0.2"
description = "A benchmarking and plotting tool for Complex SV callers evaluation"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pysam", "pandas", "plotnine", "seaborn", "plotly", "networkx", "kaleido"
]

[project.scripts]
verix = "verix.main:main"